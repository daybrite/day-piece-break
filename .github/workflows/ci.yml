name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      day-main:
        description: Build against day's main branch instead of the newest release
        type: boolean
        default: false
  schedule:
    - cron: "20 6 * * *"

permissions:
  contents: read

jobs:
  # Retired Day crate names and Rust imports (daybrite/actions check-crate-names).
  crate-names:
    name: crate names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: daybrite/actions/.github/actions/check-crate-names@main

  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Day from crates.io, or from main on a push (daybrite/actions day-deps).
      - uses: daybrite/actions/.github/actions/day-deps@v1
        with:
          day-deps: ${{ inputs.day-main && 'main' || 'auto' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features

  # The UI is pure composition; these compile the OS-specific capture and transport paths.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-ios, day-target: ios-uikit }
          - { os: ubuntu-latest, target: aarch64-linux-android, day-target: android-material }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-ohos, day-target: harmony-arkui }
          - { os: ubuntu-latest, target: wasm32-unknown-unknown, day-target: web-dom }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Day from crates.io, or from main on a push (daybrite/actions day-deps).
      - uses: daybrite/actions/.github/actions/day-deps@v1
        with:
          day-deps: ${{ inputs.day-main && 'main' || 'auto' }}
      - uses: daybrite/actions/.github/actions/setup-day-deps@v1
        with:
          target: ${{ matrix.day-target }}
          pack: "false"
      - run: cargo check --target ${{ matrix.target }}
      - run: cargo check --no-default-features --target ${{ matrix.target }}

  # On a version tag, once the checks above passed: the crate to crates.io through Trusted
  # Publishing (daybrite/actions' publish-crates). Its trusted publisher on crates.io names this
  # repository, ci.yml, and the environment `release`.
  publish:
    name: publish (crates.io)
    needs: [host, cross-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: daybrite/actions/.github/actions/publish-crates@v1
