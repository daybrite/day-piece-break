[package]
name = "day-piece-crash-reporter"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Crash capture, local reports, and opt-in delivery for Day apps"
repository = "https://github.com/daybrite/day-piece-crash-reporter"
license = "MPL-2.0"

# day-piece-crash-reporter: consent-first crash reporting for Day apps (docs/break.md, DESIGN.md §8.5). An
# optional crate: an app opts in by depending on it and calling `day_piece_crash_reporter::Config::new().init()` once at
# startup. It registers standard crash handlers (a chained panic hook + POSIX signal handlers +,
# on Android, an uncaught-exception handler), persists a report on abnormal exit, and on the next
# launch offers the reports for the user to review and, only with an explicit action, upload
# through a pluggable `Reporter`. Nothing is ever uploaded automatically.

[features]
# `ui` ships the ready-made consent surface (`consent_banner`), pulling in day-pieces + Fluent.
# On by default; a headless embedder (a server-side reporter, a custom UI) turns it off.
default = ["ui"]
ui = ["dep:day-pieces", "dep:day-localization-ui", "dep:day-build"]

[dependencies]
day-core = "0.*"
day-reactive = "0.*"
# `Lifecycle` (the WillLaunch/WillTerminate phases the sentinel hooks); a leaf crate day-core
# already pulls in, so naming it directly adds no compiled crate.
day-spec = "0.*"
# Device model + OS name/version for the report (headless, tiny).
day-part-device = "0.*"
# The default upload transport (`RestReporter`) POSTs through the native HTTP stack.
day-part-http = "0.*"

# Consent UI (feature `ui`).
day-pieces = { version = "0.*", optional = true }
day-localization-ui = { version = "0.*", optional = true }

# POSIX signal handlers (SIGSEGV/SIGABRT/…): sigaction + sigaltstack + async-signal-safe writes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The subprocess crash harness asserts on child exit signals (SIGABRT/SIGSEGV numbers vary by OS).
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# The consent-banner mock e2e mounts the piece under the mock backend and drives it.
[dev-dependencies]
day-mock = "0.*"
day-pieces = "0.*"
day-spec = "0.*"

# Android uncaught-exception handler: a Java shim (staged below) installed via day-platform-android's JNI.
[target.'cfg(target_os = "android")'.dependencies]
day-platform-android = "0.*"

# --- Android backend contribution (docs/extending.md) ---
# Stages this crate's Java (the `Thread.setDefaultUncaughtExceptionHandler` shim) into the app's
# Gradle build. Registers no renderer, the same headless-part mechanism day-part-device uses.
[package.metadata.day.android]
java = ["platform/android/java"]

[package.metadata.day]
compat = "0.*"

[[test]]
name = "banner"
required-features = ["ui"]

[build-dependencies]
# Generates the consent surface's `res::str` from resource/locales/ (feature `ui`).
day-build = { version = "0.*", optional = true }

# Lint policy: Clippy's `pedantic` group, and CI treats every warning as an error. This table
# matches the one in `day`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"
